<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Saheli — Logo Animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #FDFAF8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: sans-serif;
    overflow: hidden;
  }

  /* ── STAGE ── */
  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
  }

  /* ── LOGO WRAPPER ── */
  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 36px;
    opacity: 0;
  }

  /* ── SVG ICON ── */
  .icon-svg {
    overflow: visible;
  }

  /* Stroke paths – drawn via dashoffset */
  .path-head {
    stroke-dasharray: 114;
    stroke-dashoffset: 114;
  }
  .path-neck {
    stroke-dasharray: 14;
    stroke-dashoffset: 14;
  }
  .path-shoulders {
    stroke-dasharray: 90;
    stroke-dashoffset: 90;
  }
  .path-belly {
    stroke-dasharray: 110;
    stroke-dashoffset: 110;
  }
  /* Filled shapes – scale in */
  .bindi, .heart {
    transform-origin: center;
    transform-box: fill-box;
    transform: scale(0);
    opacity: 0;
  }

  /* ── DIVIDER ── */
  .divider {
    width: 1.5px;
    height: 0;
    background: linear-gradient(to bottom, transparent, #C1390E55, transparent);
    opacity: 0;
  }

  /* ── TEXT SIDE ── */
  .text-side {
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
  }

  .wordmark {
    font-family: Georgia, 'Palatino Linotype', serif;
    font-size: clamp(48px, 6vw, 72px);
    font-weight: 700;
    letter-spacing: 10px;
    color: #1A1A1A;
    line-height: 1;
    opacity: 0;
    transform: translateY(18px);
  }

  .rule {
    height: 2px;
    width: 0%;
    background: linear-gradient(to right, #C1390E, #E0622A, transparent);
    border-radius: 2px;
    opacity: 0;
  }

  .tagline {
    font-family: 'Trebuchet MS', 'Gill Sans', sans-serif;
    font-size: 11px;
    letter-spacing: 3.5px;
    color: #BBB;
    font-weight: 400;
    opacity: 0;
    transform: translateY(6px);
  }

  /* ── REPLAY BUTTON ── */
  .replay-btn {
    position: fixed;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    background: none;
    border: 1.5px solid #C1390E44;
    color: #C1390E;
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    padding: 10px 28px;
    border-radius: 40px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.4s, background 0.2s;
  }
  .replay-btn:hover {
    background: #C1390E0D;
  }
  .replay-btn.visible {
    opacity: 1;
  }

  /* ── SPEED TOGGLE ── */
  .speed-toggle {
    position: fixed;
    top: 28px;
    right: 28px;
    display: flex;
    gap: 8px;
  }
  .speed-btn {
    background: none;
    border: 1px solid #ddd;
    color: #999;
    font-size: 10px;
    letter-spacing: 1.5px;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-family: 'Trebuchet MS', sans-serif;
    transition: all 0.2s;
  }
  .speed-btn.active {
    border-color: #C1390E66;
    color: #C1390E;
    background: #C1390E08;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="logo-wrap" id="logoWrap">

    <!-- ICON -->
    <svg class="icon-svg" width="90" height="120" viewBox="0 0 90 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="ig" x1="0" y1="0" x2="90" y2="120" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#B5330A"/>
          <stop offset="100%" stop-color="#E0622A"/>
        </linearGradient>
      </defs>
      <circle class="path-head" cx="45" cy="22" r="18" stroke="url(#ig)" stroke-width="5" fill="none"/>
      <circle class="bindi" cx="45" cy="13" r="4.5" fill="#C1390E"/>
      <line class="path-neck" x1="45" y1="40" x2="45" y2="52" stroke="url(#ig)" stroke-width="5" stroke-linecap="round"/>
      <path class="path-shoulders" d="M 12 72 Q 12 52 45 52 Q 78 52 78 72" stroke="url(#ig)" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path class="path-belly" d="M 20 72 Q 14 100 45 108 Q 76 100 70 72" stroke="url(#ig)" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path class="heart" d="M45 97 C45 97 35 90 35 84 C35 80 38.5 78 41.5 80 C43 81 44 83 45 84.5 C46 83 47 81 48.5 80 C51.5 78 55 80 55 84 C55 90 45 97 45 97Z"
            fill="#C1390E" opacity="0.85"/>
    </svg>

    <!-- DIVIDER -->
    <div class="divider" id="divider"></div>

    <!-- TEXT -->
    <div class="text-side">
      <div class="wordmark" id="wordmark">SAHELI</div>
      <div class="rule" id="rule"></div>
      <div class="tagline" id="tagline">MATERNAL HEALTH · EVERY VILLAGE</div>
    </div>

  </div>
</div>

<!-- Controls -->
<button class="replay-btn" id="replayBtn" onclick="replay()">↺ &nbsp; REPLAY</button>

<div class="speed-toggle">
  <button class="speed-btn active" id="btn1x" onclick="setSpeed(1)">1×</button>
  <button class="speed-btn" id="btn05x" onclick="setSpeed(0.5)">0.5×</button>
</div>

<script>
// ── Easing helpers ──
function ease(t, type = 'out') {
  if (type === 'out') return 1 - Math.pow(1 - t, 3);
  if (type === 'in')  return t * t * t;
  if (type === 'inout') return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
  if (type === 'spring') {
    const c4 = (2 * Math.PI) / 2.8;
    return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
  }
}

// ── Animation timeline ──
let speedMult = 1;
let raf = null;
let startTime = null;

function setSpeed(s) {
  speedMult = 1 / s;
  document.getElementById('btn1x').classList.toggle('active', s === 1);
  document.getElementById('btn05x').classList.toggle('active', s === 0.5);
}

// Element refs
const wrap    = document.getElementById('logoWrap');
const head    = document.querySelector('.path-head');
const neck    = document.querySelector('.path-neck');
const shoulders = document.querySelector('.path-shoulders');
const belly   = document.querySelector('.path-belly');
const bindi   = document.querySelector('.bindi');
const heart   = document.querySelector('.heart');
const divider = document.getElementById('divider');
const wordmark = document.getElementById('wordmark');
const rule    = document.getElementById('rule');
const tagline = document.getElementById('tagline');
const replayBtn = document.getElementById('replayBtn');

// Timeline: [start_ms, end_ms, easing, setter(progress)]
// All times at 1× speed
function buildTimeline(dir) {
  // dir: 1 = IN, -1 = OUT
  if (dir === 1) return [
    // wrap fade in
    [0,   200,  'out',    p => { wrap.style.opacity = p; }],
    // head circle draws
    [100, 700,  'out',    p => { head.style.strokeDashoffset = 114 * (1 - p); }],
    // bindi pops
    [500, 750,  'spring', p => { bindi.style.transform = `scale(${p})`; bindi.style.opacity = p; }],
    // neck
    [650, 900,  'out',    p => { neck.style.strokeDashoffset = 14 * (1 - p); }],
    // shoulders
    [750, 1200, 'out',    p => { shoulders.style.strokeDashoffset = 90 * (1 - p); }],
    // belly
    [950, 1500, 'out',    p => { belly.style.strokeDashoffset = 110 * (1 - p); }],
    // heart pulses in
    [1400, 1750, 'spring', p => { heart.style.transform = `scale(${p})`; heart.style.opacity = 0.85 * p; }],
    // divider grows
    [1200, 1600, 'inout', p => { divider.style.height = `${90 * p}px`; divider.style.opacity = p; }],
    // wordmark rises
    [1500, 1900, 'out',   p => { wordmark.style.opacity = p; wordmark.style.transform = `translateY(${18*(1-p)}px)`; }],
    // rule expands
    [1750, 2100, 'out',   p => { rule.style.width = `${100*p}%`; rule.style.opacity = p; }],
    // tagline
    [1950, 2350, 'out',   p => { tagline.style.opacity = p; tagline.style.transform = `translateY(${6*(1-p)}px)`; }],
  ];
  else return [
    // tagline out
    [0,   300,  'in',    p => { tagline.style.opacity = 1-p; tagline.style.transform = `translateY(${6*p}px)`; }],
    // rule shrinks
    [100, 450,  'in',    p => { rule.style.width = `${100*(1-p)}%`; rule.style.opacity = 1-p; }],
    // wordmark sinks
    [300, 700,  'in',    p => { wordmark.style.opacity = 1-p; wordmark.style.transform = `translateY(${18*p}px)`; }],
    // divider shrinks
    [400, 750,  'inout', p => { divider.style.height = `${90*(1-p)}px`; divider.style.opacity = 1-p; }],
    // heart fades
    [200, 600,  'in',    p => { heart.style.transform = `scale(${1-p*0.4})`; heart.style.opacity = 0.85*(1-p); }],
    // belly undraws
    [300, 800,  'in',    p => { belly.style.strokeDashoffset = 110*p; }],
    // shoulders
    [500, 950,  'in',    p => { shoulders.style.strokeDashoffset = 90*p; }],
    // neck
    [700, 950,  'in',    p => { neck.style.strokeDashoffset = 14*p; }],
    // bindi
    [700, 900,  'in',    p => { bindi.style.transform = `scale(${1-p})`; bindi.style.opacity = 1-p; }],
    // head undraws
    [750, 1200, 'in',    p => { head.style.strokeDashoffset = 114*p; }],
    // wrap fade
    [1050, 1350, 'in',   p => { wrap.style.opacity = 1-p; }],
  ];
}

function runAnim(timeline, onDone) {
  if (raf) cancelAnimationFrame(raf);
  startTime = null;
  const maxTime = Math.max(...timeline.map(t => t[1]));

  function tick(now) {
    if (!startTime) startTime = now;
    const raw = now - startTime;
    const t = raw / speedMult; // adjusted time

    for (const [start, end, easingType, setter] of timeline) {
      const dur = end - start;
      const local = Math.max(0, Math.min(dur, t - start));
      const p = dur > 0 ? ease(local / dur, easingType) : (t >= start ? 1 : 0);
      setter(p);
    }

    if (t < maxTime) {
      raf = requestAnimationFrame(tick);
    } else {
      raf = null;
      onDone && onDone();
    }
  }
  raf = requestAnimationFrame(tick);
}

const HOLD_IN  = 2000; // ms hold after full IN
const HOLD_OUT = 1200; // ms hold after OUT before next cycle

function playIn(cb)  { runAnim(buildTimeline(1),  cb); }
function playOut(cb) { runAnim(buildTimeline(-1), cb); }

let loopTimeout = null;

function startLoop() {
  replayBtn.classList.remove('visible');
  playIn(() => {
    loopTimeout = setTimeout(() => {
      playOut(() => {
        loopTimeout = setTimeout(() => {
          replayBtn.classList.add('visible');
        }, 600 / speedMult);
      });
    }, HOLD_IN / speedMult);
  });
}

function replay() {
  clearTimeout(loopTimeout);
  replayBtn.classList.remove('visible');
  startLoop();
}

// kick off
setTimeout(startLoop, 300);
</script>
</body>
</html>
